<div *ngIf="loading" class="loading-container">
  <div class="spinner"></div>
  <p>Loading Opportunities...</p>
</div>

<div *ngIf="!loading">
  <header class="header">
    <div class="header-left">
      <h1 class="header-title">Feed</h1>
      <p>
        <i class="fa-solid fa-circle-exclamation"></i>
        Below are opportunities that you're eligible for.
      </p>
    </div>
  </header>

  <div *ngIf="opportunities.length === 0" class="no-opportunities">
    <p>Oops, No Opportunities Found! Refresh!</p>
  </div>

  <div class="cards-container" *ngIf="opportunities.length > 0">
    <app-card
      *ngFor="let opportunity of opportunities"
      [opportunity]="opportunity"
      [bookmarkedOpportunityIds]="bookmarkedIds"
      (bookmarkToggle)="onBookmarkToggle($event.opportunityId, $event.isBookmarked)"
    ></app-card>
  </div>

  <router-outlet></router-outlet>
</div>
