<main>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <h2 id="heading">Set New Password</h2>

    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>

    <div id="form-group-1">
      <label for="password">New Password</label>
      <input formControlName="password" type="password" placeholder="Enter your new password" required />
    </div>

    <div id="form-submit-group">
      <button type="submit" id="submit-btn">Update Password</button>
    </div>


    <p id="form-footer">
        Remember your password?
        <a routerLink="/login">Back to Login</a>
    </p>
  </form>
</main>
<app-footer></app-footer>
